  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="rotate(-45 256 256)">
    <!-- bar -->
    <rect x="96" y="240" width="320" height="32" rx="16" fill="url(#bar)"/>
    <!-- left plates -->
    <rect x="120" y="200" width="34" height="112" rx="12" fill="#ff6a3d"/>
    <rect x="92" y="216" width="28" height="80" rx="10" fill="#ffa07a"/>
    <!-- right plates -->
    <rect x="358" y="200" width="34" height="112" rx="12" fill="#ff6a3d"/>
    <rect x="392" y="216" width="28" height="80" rx="10" fill="#ffa07a"/>
