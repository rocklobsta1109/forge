/* ---------- Weekly sets by muscle group ---------- */
function weekStartTs(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function setsByMuscleBetween(from,to){
  const m={};
  state.workouts.forEach(w=>{ if(w.end>=from&&w.end<to) w.exercises.forEach(ex=>{
    const mg=ex.muscle||"Other"; m[mg]=(m[mg]||0)+ex.sets.length; }); });
  return m;
}
function plannedWeeklySets(variant){
  const keys=new Set(Object.values(planFor(Date.now())));
  const m={};
  ALL_PROGRAM.filter(d=>keys.has(d.key)).forEach(d=>d.ex.forEach(e=>{ const sets=(e[variant]&&e[variant][0])||0; m[e.muscle]=(m[e.muscle]||0)+(deloadActive()?deloadSetCount(sets):sets); }));
  return m;
}
function muscleSetsCard(){
  const wk=7*86400000, ws=weekStartTs(Date.now());
  const cur=setsByMuscleBetween(ws, ws+wk), last=setsByMuscleBetween(ws-wk, ws);
  const variant=state.settings.planVariant||"his";
  const plan=plannedWeeklySets(variant);
  const order=["Legs","Chest","Back","Shoulders","Arms","Core"];
  const cw=cycleWeekOf(Date.now());
  const card=el(`<div class="chart-card"><h4>Weekly sets by muscle</h4>
    <div class="csub">Hard sets this week vs your ${variant==="his"?"His":"Hers"} ${deloadActive()?"deload ":""}plan · Week ${cw} (${cw===1?"A/B/C":"D/E/F"}) · resets Monday</div></div>`);
  order.forEach(mg=>{
    const done=cur[mg]||0, target=plan[mg]||0, prev=last[mg]||0;
    const hit=target>0&&done>=target;
    const pct=target?Math.min(100,done/target*100):(done?100:0);
    card.appendChild(el(`<div class="mrow">
      <div class="mtop"><span>${esc(mg)}</span><span class="mnum"><b style="color:${hit?"var(--good)":"var(--text)"}">${done}</b> / ${target} sets · last wk ${prev}</span></div>
      <div class="mtrack"><div class="mfill ${hit?"hit":""}" style="width:${pct}%"></div></div></div>`));
  });
  // anything outside the core six (Cardio, Mobility, custom "Other"…) — count only
  Object.keys({...cur,...last}).filter(mg=>!order.includes(mg)).sort().forEach(mg=>{
    const done=cur[mg]||0, prev=last[mg]||0; if(!done&&!prev) return;
    card.appendChild(el(`<div class="mrow"><div class="mtop"><span>${esc(mg)}</span><span class="mnum"><b style="color:var(--text)">${done}</b> sets · last wk ${prev}</span></div></div>`));
  });
  return card;
}

const FEATURED_LIFTS=["Back Squat","Front Squat","Barbell Bench Press","Deadlift","Romanian Deadlift","Overhead Press","Barbell Row","Pull-Up","Chin-Up","DB Goblet Squat","DB Front Squat","Flat DB Bench Press","Incline DB Press","DB Romanian Deadlift","One-Arm DB Row","DB Overhead Press","Bulgarian Split Squat"];
function strengthRecord(name){
  let bestW=0,bestE=0,bestReps=0,bestSet=null,last=0; const repBests={};
  state.workouts.forEach(w=>w.exercises.filter(e=>sameExercise(e,name)).forEach(ex=>{ last=Math.max(last,w.end); ex.sets.forEach(s=>{
    const wt=Number(s.weight)||0,reps=Number(s.reps)||0,e=epley(wt,reps); bestW=Math.max(bestW,wt); bestReps=Math.max(bestReps,reps);
    if(e>bestE){ bestE=e; bestSet={weight:wt,reps}; }
    if(wt&&reps>0&&reps<=20) repBests[reps]=Math.max(repBests[reps]||0,wt);
  }); }));
  return last?{name,bestW,bestE,bestReps,bestSet,last,repBests}:null;
}
function openStrengthRecord(record){
  openSheet(record.name,body=>{
    const main=record.bestE>0?`${fmtNum(record.bestE)} ${U()} est 1RM`:`${record.bestReps} reps`;
    body.appendChild(el(`<div class="hero" style="margin-bottom:12px"><h2>${esc(main)}</h2><p>Heaviest load · ${fmtNum(record.bestW)} ${U()} · last trained ${fmtDate(record.last)}</p></div>`));
    const reps=Object.keys(record.repBests).map(Number).sort((a,b)=>a-b);
    if(reps.length){ body.appendChild(el(`<div class="section-label" style="margin:10px 0 5px">Rep records</div>`));
      const box=el(`<div class="card" style="padding:4px 14px"></div>`); reps.forEach(r=>box.appendChild(el(`<div class="summary-muscle"><span>${r} rep${r!==1?"s":""}</span><b>${fmtNum(record.repBests[r])} ${U()}</b></div>`))); body.appendChild(box); }
    const pts=[...state.workouts].sort((a,b)=>a.end-b.end).map(w=>{ const ex=w.exercises.find(e=>sameExercise(e,record.name)); if(!ex)return null; const y=Math.max(...ex.sets.map(s=>epley(s.weight,s.reps))); return y?{x:w.end,y}:null; }).filter(Boolean);
    if(pts.length){ body.appendChild(el(`<div class="section-label" style="margin:14px 0 5px">Strength trend</div>`)); body.appendChild(lineChart(pts)); }
  });
}
function strengthRecordsCard(){
  let records=FEATURED_LIFTS.map(strengthRecord).filter(Boolean);
  if(!records.length){
    const names=[...new Set(state.workouts.flatMap(w=>w.exercises.map(e=>e.name)))]; records=names.map(strengthRecord).filter(r=>r&&r.bestE>0).sort((a,b)=>b.last-a.last).slice(0,6);
  }
  const card=el(`<div class="chart-card"><div class="row" style="margin-bottom:2px"><div class="catalog-equip">${icon("trophy")}</div><div class="grow"><h4 style="margin:0">Strength records</h4><div class="csub" style="margin:2px 0 0">Key lifts · tap one for rep records and its trend</div></div></div></div>`);
  if(!records.length){ card.appendChild(el(`<div class="muted" style="padding:8px 0">Complete weighted sets to build your record board.</div>`)); return card; }
  records.slice(0,8).forEach(r=>{ const value=r.bestE>0?`${fmtNum(r.bestE)} ${U()}`:`${r.bestReps} reps`;
    const row=el(`<div class="record-row row" style="cursor:pointer"><div class="grow"><div class="title">${esc(r.name)}</div><div class="sub">${r.bestSet?`Best set ${fmtNum(r.bestSet.weight)} × ${r.bestSet.reps}`:`Best bodyweight set · ${r.bestReps} reps`} · ${fmtDate(r.last)}</div></div><div style="text-align:right"><div class="record-value">${esc(value)}</div><div class="pill">${r.bestE>0?"est 1RM":"best"}</div></div></div>`);
    row.onclick=()=>openStrengthRecord(r); card.appendChild(row);
  });
  return card;
}

function progressSummaryCard(hist){
  const ws=weekStartTs(Date.now()), recent=hist.filter(w=>w.end>=ws), volume=recent.reduce((n,w)=>n+workoutVolume(w),0);

    <div class="progress-metric"><div class="value">${prs}</div><div class="label">New records</div></div>
  </div>`);
}

function renderProgress(app){
  app.appendChild(header("Progress",{back:false}));
  const s=el(`<div class="screen"></div>`);
  s.appendChild(el(`<div class="page-intro"><div class="page-kicker">Training intelligence</div><h2>Proof of the work.</h2><p>Volume, consistency, and strength records in one focused view.</p></div>`));

  if(state.workouts.length<1){
    s.appendChild(bodyweightCard());
    s.appendChild(el(`<div class="empty" style="padding:32px 20px">${icon("progress","lg")}<h3>No training data yet</h3><div>Log a few workouts to see volume, PRs, and exercise trends.</div></div>`));
    app.appendChild(s); return;
  }
  const hist=[...state.workouts].sort((a,b)=>a.end-b.end);
  s.appendChild(progressSummaryCard(hist));

  // Weekly sets per muscle vs plan
  s.appendChild(muscleSetsCard());
  s.appendChild(strengthRecordsCard());
  s.appendChild(bodyweightCard());

  // Volume per workout (line)
  const volPts=hist.map(w=>({x:w.end, y:workoutVolume(w)}));
  s.appendChild(chartCard("Volume per workout", `Total ${U()} lifted each session`, lineChart(volPts)));

  // Workouts per week (bar)
  const weeks={};
  hist.forEach(w=>{ const d=new Date(w.end); const monday=new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7)); monday.setHours(0,0,0,0);
    const k=monday.getTime(); weeks[k]=(weeks[k]||0)+1; });
  const weekPts=Object.keys(weeks).sort().slice(-10).map(k=>({label:new Date(+k).toLocaleDateString(undefined,{month:"numeric",day:"numeric"}), y:weeks[k]}));
  s.appendChild(chartCard("Workouts per week", "Last 10 weeks", barChart(weekPts)));

  // Per-exercise est 1RM
  const allEx=[...new Set(state.workouts.flatMap(w=>w.exercises.map(e=>e.name)))].sort();
  const card=el(`<div class="chart-card"></div>`);
  card.appendChild(el(`<h4>Exercise progress</h4>`));
  card.appendChild(el(`<div class="csub">Estimated 1-rep max over time</div>`));
  const sel=el(`<select class="input" style="margin-bottom:14px"></select>`);
  allEx.forEach(n=> sel.appendChild(el(`<option>${esc(n)}</option>`)) );
  const holder=el(`<div></div>`);
  const drawEx=()=>{
    const name=sel.value;
    const pts=hist.map(w=>{ const ex=w.exercises.find(e=>sameExercise(e,name)); if(!ex)return null;
      const best=Math.max(...ex.sets.map(s=>epley(s.weight,s.reps))); return {x:w.end,y:best}; }).filter(Boolean).filter(p=>p.y>0);
    holder.innerHTML="";
    if(pts.length<1){ holder.appendChild(el(`<div class="muted" style="padding:20px 0;text-align:center">No data for this exercise.</div>`)); return; }
    holder.appendChild(lineChart(pts));
    const max=Math.max(...pts.map(p=>p.y));
    holder.appendChild(el(`<div class="legend"><span>Best e1RM: <b style="color:var(--accent)">${fmtNum(max)} ${U()}</b></span></div>`));
  };
  sel.onchange=drawEx; card.appendChild(sel); card.appendChild(holder); s.appendChild(card); drawEx();

  // Personal records table
  s.appendChild(el(`<div class="section-label">All Exercise Records</div>`));
  const prs=allEx.map(name=>{
    let bestW=0,bestE=0;
    state.workouts.forEach(w=>w.exercises.filter(e=>sameExercise(e,name)).forEach(e=>e.sets.forEach(sx=>{
      bestW=Math.max(bestW,Number(sx.weight)||0); bestE=Math.max(bestE,epley(sx.weight,sx.reps)); })));
    return {name,bestW,bestE};
  }).filter(p=>p.bestE>0).sort((a,b)=>b.bestE-a.bestE);
  const recordList=el(`<div class="catalog-group"></div>`);
  prs.forEach(p=> recordList.appendChild(el(`<div class="catalog-row"><div class="catalog-equip">${icon("trophy")}</div><div class="grow"><div class="title">${esc(p.name)}</div><div class="sub">Top set ${fmtNum(p.bestW)} ${U()}</div></div><div style="text-align:right"><div class="record-value">${fmtNum(p.bestE)}</div><div class="pill">est 1RM</div></div></div>`)) );
  if(prs.length) s.appendChild(recordList);
  app.appendChild(s);
}

/* ---------- SVG line chart ---------- */
let chartSeq=0;
function lineChart(pts){
  const W=480,H=190,padL=42,padR=30,padT=20,padB=32;
  if(pts.length===1) pts=[{x:pts[0].x-86400000,y:pts[0].y},pts[0]];
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),maxY=Math.max(1,...ys),minY=0;
  const sx=x=>padL+((x-minX)/((maxX-minX)||1))*(W-padL-padR);
  const sy=y=>H-padB-((y-minY)/((maxY-minY)||1))*(H-padT-padB);
  let d="",area="";
  pts.forEach((p,i)=>{ const X=sx(p.x),Y=sy(p.y); d+=(i?"L":"M")+X.toFixed(1)+" "+Y.toFixed(1)+" "; });
  area=d+`L ${sx(maxX).toFixed(1)} ${H-padB} L ${sx(minX).toFixed(1)} ${H-padB} Z`;
  let grid="";
  [1,.5,0].forEach(frac=>{ const val=maxY*frac, gy=sy(val); grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/><text class="chart-label" x="${padL-7}" y="${gy+3}" text-anchor="end">${fmtNum(val).toLocaleString()}</text>`; });
  let dots=pts.map((p,i)=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${i===pts.length-1?4:2.5}" fill="var(--accent)"/>`).join("");
  const last=pts[pts.length-1], grad="forgeLine"+(++chartSeq), startDate=new Date(minX).toLocaleDateString(undefined,{month:"short",day:"numeric"}), endDate=new Date(maxX).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const svg=el(`<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:190px" role="img" aria-label="Trend from ${esc(startDate)} to ${esc(endDate)}, latest value ${esc(fmtNum(last.y))}">
    <defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#${grad})"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text class="chart-label" x="${padL}" y="${H-8}" text-anchor="start">${esc(startDate)}</text>
    <text class="chart-label" x="${W-padR}" y="${H-8}" text-anchor="end">${esc(endDate)}</text>
    <text class="chart-direct" x="${Math.min(W-padR-4,sx(last.x)-4)}" y="${Math.max(padT+11,sy(last.y)-9)}" text-anchor="end">${fmtNum(last.y).toLocaleString()}</text>
  </svg>`);
  return svg;
}

/* ---------- SVG bar chart ---------- */
function barChart(pts){
  const W=480,H=170,padB=24,padT=10,gap=8;
  const maxY=Math.max(1,...pts.map(p=>p.y));
  const bw=(W-(pts.length+1)*gap)/pts.length;
  let bars="";
  pts.forEach((p,i)=>{ const x=gap+i*(bw+gap); const h=(p.y/maxY)*(H-padT-padB); const y=H-padB-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="5" fill="var(--accent)"/>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="800">${p.y}</text>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" fill="var(--faint)" font-size="10">${esc(p.label)}</text>`;
  });
  return el(`<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:170px" role="img" aria-label="Bar chart with ${pts.length} periods; highest value ${maxY}">${bars}</svg>`);
}

function routinePrescription(r){ if(/\(His · Mass\)$/.test(r.name)) return "his"; if(/\(Hers · Tone\)$/.test(r.name)) return "hers"; return null; }
function routineBaseName(r){ return r.name.replace(/\s*\((?:His · Mass|Hers · Tone)\)$/,"" ).trim(); }
function groupedRoutines(){
  const groups=[], byBase=new Map();
  state.routines.forEach(r=>{
    const prescription=routinePrescription(r);
    if(!prescription){ groups.push({key:"single:"+r.id,base:r.name,single:r}); return; }
    const base=routineBaseName(r); let g=byBase.get(base);
    if(!g){ g={key:"paired:"+base,base,his:null,hers:null}; byBase.set(base,g); groups.push(g); }
    g[prescription]=r;
  });
  return groups;
}
function selectedRoutine(group){ const v=state.settings.planVariant||"his"; return group.single||group[v]||group.his||group.hers; }
function routineMinutes(r){ const sets=r.exercises.reduce((n,e)=>n+(Number(e.sets)||1),0); return Math.max(20,Math.round((sets*2.1+r.exercises.length*1.5)/5)*5); }
function routineMuscles(r){ return [...new Set(r.exercises.map(e=>e.muscle).filter(Boolean))]; }
function equipmentIconName(eq){ return eq==="dumbbell"?"dumbbell":eq==="bodyweight"?"body":eq==="pullup"?"body":"equipment"; }
function routineEquipment(r){
  const kinds=new Set(); r.exercises.forEach(re=>{ const mapped=r.bodyweight?re.name:mapExerciseForMode(re.name,equipMode()); const ex=exerciseByRef(mapped); if(ex&&ex.equipment) kinds.add(ex.equipment); });
  return [...kinds];
}

      const up=el(`<button class="btn ghost sm" aria-label="Move ${esc(ex.name)} up" style="flex:1">↑</button>`); up.onclick=()=>{ if(i>0){[draft.exercises[i-1],draft.exercises[i]]=[draft.exercises[i],draft.exercises[i-1]]; drawList();} };

function equipChipRow(initial, onPick){

function equipTagHTML(e){ return e&&e.equipment ? `<span class="cat-tag" style="flex:0 0 auto">${EQUIP_SHORT[e.equipment]}</span>` : ""; }

function openPicker(onDone){
  const chosen=new Set();

    body.appendChild(footer);
    function draw(){
      const q=search.value.trim().toLowerCase();
      const groups={};
      state.exercises.filter(e=>!q||e.name.toLowerCase().includes(q)||e.muscle.toLowerCase().includes(q))

async function connectSync(name){
  state.settings.syncName=name; DB.set("settings",state.settings);
  clearTimeout(_pushT);
  try{
    const res=await fetch("api/data/"+encodeURIComponent(name));
    if(res.ok){ const server=await res.json();
      if(server && server.updated){
        // workout history is combined either way; the choice only decides settings/routines
        if(confirmAct(`A backup named “${name}” already exists on the server.\n\nWorkout history will be combined either way.\n\nOK = use the backup's settings & routines.\nCancel = keep this device's settings & routines.`)){
          localStorage.setItem("forge_updatedAt","1");   // let the server win last-write-wins
        }
      }
    }
  }catch(e){ toast("Server unreachable — saved name, will back up when reachable"); }
  const ok=await syncNow(); render(); toast(ok?"☁︎ Backup connected":"Connected · will back up when server is reachable");
}
async function forceRestore(){
  if(!confirmAct(`Replace ALL data on this device with the latest “${syncName()}” backup from the server?`)) return;
  try{ const res=await fetch("api/data/"+encodeURIComponent(syncName())); if(!res.ok){ toast("Server unreachable"); return; }
    const server=await res.json();
    if(!server||!server.updated){ toast("No backup found for this name"); return; }
    applySnapshot(server); toast("⤵︎ Restored from backup");
  }catch(e){ toast("Server unreachable"); }
}

function exportData(){
  const data={version:DATA_VERSION, exported:Date.now(), settings:state.settings, exercises:state.exercises, routines:state.routines, workouts:state.workouts, plan:state.plan, bodyweights:state.bodyweights, deleted:state.deleted};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`forge-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Backup downloaded");
}
function validateBackupData(d){
  if(!d||typeof d!=="object"||Array.isArray(d)) return "Backup is not a JSON object";
  if(d.version!==undefined&&!Number.isFinite(Number(d.version))) return "Backup format version is invalid";
  if(Number(d.version||1)>DATA_VERSION) return `Backup format v${d.version} is newer than this Forge version`;
  const recognized=["settings","exercises","routines","workouts","plan","bodyweights","deleted"];
  if(!recognized.some(k=>Object.prototype.hasOwnProperty.call(d,k))) return "No Forge data found in this file";
  for(const k of ["exercises","routines","workouts","bodyweights","deleted"]){ if(d[k]!==undefined&&!Array.isArray(d[k])) return `${k} must be a list`; }
  for(const k of ["settings","plan"]){ if(d[k]!==undefined&&(!d[k]||typeof d[k]!=="object"||Array.isArray(d[k]))) return `${k} must be an object`; }
  return "";
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result), invalid=validateBackupData(d); if(invalid){toast(invalid);return;}
      if(!confirmAct("Import this backup? It will REPLACE your current data.")) return;
      if(d.settings)state.settings=d.settings; if(d.exercises)state.exercises=d.exercises;
      if(d.routines)state.routines=d.routines; if(d.workouts)state.workouts=d.workouts;
      if(d.plan)state.plan=d.plan; if(d.bodyweights)state.bodyweights=d.bodyweights;
      if(d.deleted)state.deleted=d.deleted;
      state.active=null; DB.set("active",null); stopTimer(); stopRest();
      migrateExerciseData(); seedData();
      ["settings","exercises","routines","workouts","plan","bodyweights","deleted"].forEach(save); render(); toast("Data imported");
    }catch(e){ toast("Invalid backup file"); } };
    r.readAsText(f); };
  inp.click();
}

/* ============================================================
   SHEET (modal) helpers
   ============================================================ */
function openSheet(title, build){
  closeSheet();
  const bg=el(`<div class="sheet-bg"></div>`);
  const sheet=el(`<div class="sheet"></div>`);
  sheet.appendChild(el(`<div class="grab"></div>`));
  const head=el(`<div class="sheet-head"><h3>${esc(title)}</h3></div>`);
  const close=el(`<button class="iconbtn" aria-label="Close" style="background:var(--surface-2)">✕</button>`); close.onclick=closeSheet; head.appendChild(close);
  sheet.appendChild(head);
  const body=el(`<div class="sheet-body"></div>`); sheet.appendChild(body);
  bg.appendChild(sheet);
  bg.onclick=e=>{ if(e.target===bg) closeSheet(); };
  document.body.appendChild(bg);
  build(body);
}
function closeSheet(){ const b=$(".sheet-bg"); if(b)b.remove(); }

/* ============================================================
   BOOT
   ============================================================ */
// migrate: ensure default exercises exist if list somehow empty
if(!state.exercises || !state.exercises.length){ state.exercises=DEFAULT_EXERCISES; save("exercises"); }
seedData();

render();

// merge with the latest backup on launch (if cloud backup is connected)
if(syncName()) syncNow();

// service worker — register + auto-reload to the new version when one activates
if("serviceWorker" in navigator){
  let _refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(_refreshing) return; _refreshing=true;
    // don't yank the page out from under an in-progress workout
    if(state.active && peek().screen==="workout"){ _refreshing=false; return; }
    location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then((reg)=>{
      reg.update();
      setInterval(()=>reg.update(), 60*60*1000); // re-check hourly while open
    }).catch(()=>{});
  });
}
// keep timer alive when resuming workout view after reload
if(state.active && peek().screen!=="workout"){ /* stay on home, banner shown */ }
</script>
